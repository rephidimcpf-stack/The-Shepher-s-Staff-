<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Shepherd's Staff — Study Companion</title>
<meta name="description" content="A study companion for The Shepherd's Staff — notes, progress tracking, and topic concordance.">
<meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shepherd's Staff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Shepherd's Staff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-display:'Fraunces','Noto Serif Telugu',Georgia,serif;
  --font-body:'Plus Jakarta Sans','Noto Sans Telugu',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --bg:#f6f2ea; --bg2:#efe8da;
  --surface:#fffdf8; --surface2:#f3ecdf;
  --border:rgba(31,42,58,0.12); --border-strong:rgba(31,42,58,0.24);
  --text:#1f242c; --text-dim:#6c6e78;
  --navy:#1f3a5f; --navy-dim:rgba(31,58,95,0.08);
  --gold:#a9781f; --gold-dim:rgba(169,120,31,0.13);
  --sage:#5c7a56; --sage-dim:rgba(92,122,86,0.13);
  --shadow:0 2px 10px rgba(31,42,58,0.06);
  --shadow-lg:0 10px 34px rgba(31,42,58,0.10);
}
[data-theme="dark"]{
  --bg:#12151b; --bg2:#0e1116;
  --surface:#191d25; --surface2:#20252f;
  --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.2);
  --text:#e9e7e2; --text-dim:#9aa1ad;
  --navy:#8fb4dd; --navy-dim:rgba(143,180,221,0.13);
  --gold:#dcb063; --gold-dim:rgba(220,176,99,0.15);
  --sage:#93b58c; --sage-dim:rgba(147,181,140,0.15);
  --shadow:0 2px 12px rgba(0,0,0,0.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:16px; line-height:1.65;
  overflow-wrap:break-word;
  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  background-image:
    radial-gradient(ellipse 70% 40% at 50% -8%, var(--gold-dim) 0%, transparent 60%),
    radial-gradient(circle, var(--border) 1px, transparent 1px);
  background-size:auto, 26px 26px;
  background-attachment:fixed, fixed;
}
.wrap{max-width:1260px;margin:0 auto;padding:0 26px}

/* ---------- HERO ---------- */
.hero{display:flex;align-items:center;gap:24px;padding:52px 0 30px;border-bottom:1px solid var(--border)}
.staff{width:52px;height:132px;color:var(--gold);flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(169,120,31,0.18))}
.hero__kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(34px,5vw,54px);line-height:1.12;margin:0 0 8px;letter-spacing:-0.5px}
.hero__attrib{color:var(--text-dim);font-size:14px;margin:0}
.hero__tagline{margin:12px 0 0;font-size:15px;color:var(--sage);font-weight:600;letter-spacing:0.2px}

/* ---------- TOOLBAR ---------- */
.toolbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 0;margin-bottom:34px}
.toolbar__in{display:flex;align-items:center;gap:18px}
.search{position:relative;flex:1;min-width:0;max-width:520px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--text-dim);fill:none;stroke-width:2;pointer-events:none}
.search input{width:100%;font-family:var(--font-body);font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 14px 11px 40px;outline:none;transition:border-color .18s, box-shadow .18s}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.toolbar__right{margin-left:auto;display:flex;align-items:center;gap:16px}
.meter{display:flex;align-items:center;gap:11px}
.ring{width:42px;height:42px;transform:rotate(-90deg);flex-shrink:0}
.ring circle{fill:none;stroke-width:3.4}
.ring__bg{stroke:var(--border-strong)}
.ring__fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1)}
.meter__txt{line-height:1.25}
.meter__num{font-family:var(--font-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.meter__lbl{font-size:11px;color:var(--text-dim);letter-spacing:0.3px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:12px;padding:9px 13px;border-radius:9px;cursor:pointer;transition:all .16s;white-space:nowrap}
.iconbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface2)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.iconbtn[hidden]{display:none !important}
.iconbtn--primary{background:var(--gold);color:#fff;border-color:var(--gold)}
.iconbtn--primary:hover{background:var(--gold);color:#fff;opacity:.9}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:268px 1fr;gap:44px;align-items:start}
.sidebar{position:sticky;top:96px;max-height:calc(100dvh - 120px);overflow-y:auto;padding-bottom:20px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.side-title{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.side-link{display:block;text-decoration:none;color:var(--text);padding:12px 13px;border-radius:11px;border:1px solid transparent;margin-bottom:8px;transition:all .16s}
.side-link:hover{background:var(--surface);border-color:var(--border)}
.side-link.active{background:var(--surface);border-color:var(--border-strong);box-shadow:var(--shadow)}
.side-link__top{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.side-link__roman{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--gold);flex-shrink:0}
.side-link__name{font-size:13.5px;font-weight:600;line-height:1.35}
.side-link__bar{height:4px;border-radius:3px;background:var(--border);overflow:hidden}
.side-link__fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--sage));transition:width .5s}
.side-link__meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-top:6px;font-variant-numeric:tabular-nums}

/* ---------- SECTIONS ---------- */
.part{margin-bottom:56px;scroll-margin-top:96px}
.part.hide{display:none}
.part__head{display:flex;align-items:flex-start;gap:18px;padding-bottom:18px;margin-bottom:24px;border-bottom:2px solid var(--border-strong);cursor:pointer}
.part__head:hover .part__title{color:var(--gold)}
.part__roman{font-family:var(--font-display);font-size:46px;font-weight:600;line-height:1;color:var(--gold);flex-shrink:0}
.part__title{font-family:var(--font-display);font-size:clamp(24px,3vw,32px);font-weight:600;margin:0;line-height:1.2}
.part__sub{color:var(--text-dim);font-size:14px;margin:5px 0 0}
.part__note{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--navy);background:var(--navy-dim);padding:4px 11px;border-radius:20px}
.part__chev{margin-left:auto;flex-shrink:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text-dim);cursor:pointer;transition:all .16s;padding:0}
.part__chev:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface)}
.part__chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .22s}
.part.collapsed .part__chev svg{transform:rotate(-90deg)}
.part.collapsed .part__body{display:none}
.toolbar__right{flex-wrap:wrap;justify-content:flex-end}

/* ---------- CARD ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;transition:box-shadow .18s, border-color .18s, transform .18s;overflow:hidden;animation:fadeUp .45s ease-out both;animation-delay:calc(var(--i,0)*0.022s)}
.card:hover{box-shadow:var(--shadow);border-color:var(--border-strong)}
.card.hide{display:none}
.card.done{border-color:color-mix(in srgb,var(--sage) 45%,var(--border))}
.card__head{display:flex;align-items:center;gap:15px;padding:15px 18px;cursor:pointer;user-select:none}
.check{flex-shrink:0;width:26px;height:26px;border-radius:8px;border:2px solid var(--border-strong);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .16s;padding:0}
.check:hover{border-color:var(--sage)}
.check svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:all .18s}
.card.done .check{background:var(--sage);border-color:var(--sage)}
.card.done .check svg{opacity:1;transform:scale(1)}
.badge{flex-shrink:0;min-width:40px;text-align:center;font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--navy);background:var(--navy-dim);padding:4px 9px;border-radius:8px}
.card__title{flex:1;min-width:0;margin:0;font-size:15.5px;font-weight:600;line-height:1.4}
.card.done .card__title{color:var(--text-dim)}
.card__title mark{background:var(--gold-dim);color:inherit;border-radius:3px;padding:0 2px}
.count{flex-shrink:0;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);padding:3px 9px;border-radius:20px}
.chev{flex-shrink:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:transform .2s}
.chev svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.card.open .chev{transform:rotate(180deg)}
.card__subs{display:none;padding:2px 18px 18px 60px;border-top:1px solid var(--border)}
.card.open .card__subs{display:block;animation:fadeUp .28s ease-out}
.card__subs ol{list-style:none;margin:12px 0 0;padding:0;counter-reset:s}
.sub{counter-increment:s;margin-bottom:4px;border-radius:9px}
.sub__row{display:flex;align-items:flex-start;gap:9px;padding:5px 6px 5px 0}
.sub__mark{flex-shrink:0;min-width:18px;font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--gold);padding-top:3px}
.sub__mark::before{content:counter(s,upper-alpha) "."}
.sub__txt{flex:1;min-width:0;font-size:14px;line-height:1.55;color:var(--text-dim)}
.sub.hit .sub__txt{color:var(--text);font-weight:600}
.sub__txt mark{background:var(--gold-dim);color:inherit;border-radius:3px;padding:0 2px}
.sub-note-btn{flex-shrink:0;width:26px;height:26px;border:none;background:transparent;color:var(--text-dim);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;opacity:.4;padding:0}
.sub:hover .sub-note-btn,.sub.note-open .sub-note-btn{opacity:.9}
.sub-note-btn:hover{background:var(--gold-dim);color:var(--gold);opacity:1}
.sub-note-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sub.has-note .sub-note-btn{opacity:1;color:var(--gold);background:var(--gold-dim)}
.sub__note{display:none;padding:2px 6px 12px 27px}
.sub.note-open .sub__note{display:block;animation:fadeUp .2s ease-out}
.tailnote{margin:16px 0 0;font-size:13px;font-style:italic;color:var(--text-dim);padding-left:14px;border-left:2px solid var(--border-strong)}

.note-btn{flex-shrink:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-dim);cursor:pointer;border-radius:8px;transition:all .16s;padding:0}
.note-btn:hover{background:var(--gold-dim);color:var(--gold)}
.note-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card.has-note .note-btn{color:var(--gold);background:var(--gold-dim)}
.card__note{display:none;padding:0 18px 16px 60px}
.card.note-open .card__note{display:block;animation:fadeUp .25s ease-out}

/* ---------- RICH-TEXT NOTE EDITOR (view / edit modes) ---------- */
.editor{position:relative;border:1px solid var(--border);border-radius:10px;background:var(--surface2);overflow:hidden;transition:border-color .16s,box-shadow .16s,background .16s}
.editor[data-mode="edit"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim);background:var(--surface)}
.editor__view{position:relative}
.editor__preview{
  min-height:42px;max-height:44vh;overflow-y:auto;
  padding:12px 14px;
  font-family:var(--font-body);font-size:14.5px;line-height:1.6;
  color:var(--text);overflow-wrap:break-word;
}
.editor__preview:empty::before{content:attr(data-ph);color:var(--text-dim);opacity:.7;pointer-events:none}
.editor__edit-btn{
  position:absolute;top:7px;right:7px;
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-dim);border-radius:7px;padding:4px 9px;
  cursor:pointer;opacity:.55;transition:opacity .16s,color .16s,border-color .16s,background .16s;
}
.editor:hover .editor__edit-btn{opacity:1}
.editor__edit-btn:hover{color:var(--gold);border-color:var(--gold);background:var(--surface2)}
.editor__edit-btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.editor__edit-wrap{display:none;flex-direction:column}
.editor[data-mode="edit"] .editor__edit-wrap{display:flex}
.editor[data-mode="edit"] .editor__view{display:none}

.editor__bar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:5px 6px;border-bottom:1px solid var(--border);background:var(--surface)}
.editor__btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-dim);border-radius:7px;cursor:pointer;padding:0;font-family:var(--font-body);font-size:13px;font-weight:700;line-height:1;transition:background .14s,color .14s}
.editor__btn:hover{background:var(--gold-dim);color:var(--gold)}
.editor__btn.on{background:var(--gold-dim);color:var(--gold)}
.editor__btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.editor__sep{width:1px;height:18px;background:var(--border);margin:0 3px;flex-shrink:0}
.editor__area{
  min-height:92px;max-height:44vh;overflow-y:auto;
  padding:12px 14px;
  font-family:var(--font-body);font-size:14.5px;line-height:1.6;
  color:var(--text);outline:none;overflow-wrap:break-word;
}
.editor__area:empty::before{content:attr(data-ph);color:var(--text-dim);opacity:.7;pointer-events:none}
.editor__actions{display:flex;justify-content:flex-end;gap:8px;padding:7px 8px;border-top:1px solid var(--border);background:var(--surface)}
.editor__done{
  font-family:var(--font-mono);font-size:11.5px;font-weight:500;
  background:var(--sage);color:#fff;border:none;border-radius:7px;
  padding:6px 14px;cursor:pointer;transition:opacity .16s,transform .1s;
}
.editor__done:hover{opacity:.88}
.editor__done:active{transform:translateY(1px)}

.editor__preview h1,.editor__preview h2,.editor__preview h3,.editor__preview h4,
.editor__area h1,.editor__area h2,.editor__area h3,.editor__area h4{
  font-family:var(--font-display);font-weight:600;line-height:1.3;margin:.45em 0 .2em;
}
.editor__preview h1,.editor__area h1{font-size:1.45em}
.editor__preview h2,.editor__area h2{font-size:1.28em}
.editor__preview h3,.editor__area h3{font-size:1.12em}
.editor__preview ul,.editor__preview ol,
.editor__area ul,.editor__area ol{margin:.35em 0;padding-left:1.5em}
.editor__preview ul,.editor__area ul{list-style:disc}
.editor__preview ol,.editor__area ol{list-style:decimal}
.editor__preview li,.editor__area li{margin:.15em 0}
.editor__preview blockquote,.editor__area blockquote{margin:.4em 0;padding-left:12px;border-left:3px solid var(--border-strong);color:var(--text-dim)}
.editor__preview a,.editor__area a{color:var(--navy);text-decoration:underline}
.editor__preview hr,.editor__area hr{border:none;border-top:1px solid var(--border-strong);margin:.6em 0}

.sub__note .editor__preview{min-height:36px;font-size:13.5px}
.sub__note .editor__area{min-height:64px;font-size:13.5px}

.emoji-panel{position:fixed;z-index:200;max-height:200px;overflow-y:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:7px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-panel button{border:none;background:transparent;font-size:17px;line-height:1;padding:5px 0;border-radius:7px;cursor:pointer;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.emoji-panel button:hover{background:var(--gold-dim)}

.note-bar{display:flex;align-items:center;gap:12px;margin-top:8px}
.note-saved{font-family:var(--font-mono);font-size:11px;color:var(--sage);opacity:0;transition:opacity .3s}
.note-saved.show{opacity:1}
.note-clear{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 10px;cursor:pointer;transition:all .16s}
.note-clear:hover{color:#b23b3b;border-color:#b23b3b}
.foot__meta{line-height:1.7}
.foot__actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

.nomatch{display:none;text-align:center;padding:70px 20px;color:var(--text-dim)}
.nomatch.show{display:block}
.nomatch svg{width:38px;height:38px;stroke:var(--border-strong);fill:none;stroke-width:1.6;margin-bottom:14px}

.foot{margin:70px 0 46px;padding-top:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--border);font-size:12.5px;color:var(--text-dim);text-align:center;line-height:1.7}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--surface);color:var(--text);border:1px solid var(--border-strong);
  border-radius:12px;padding:12px 18px;font-size:13.5px;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:300;
  max-width:calc(100vw - 40px);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

@media (max-width:940px){
  .layout{grid-template-columns:1fr;gap:26px}
  .sidebar{position:static;max-height:none;display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .side-title{display:none}
  .side-link{min-width:210px;flex-shrink:0;margin-bottom:0;background:var(--surface);border-color:var(--border)}
  .hero{flex-direction:column;align-items:flex-start;gap:16px;padding:34px 0 24px}
  .staff{height:78px;width:34px}
  .toolbar__in{flex-wrap:wrap;gap:12px}
  .search{max-width:none;order:-1;flex-basis:100%}
  .toolbar__right{margin-left:0;width:100%;justify-content:space-between}
  .card__subs,.card__note{padding-left:22px}
  .editor__edit-btn{opacity:.85}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <svg class="staff" viewBox="0 0 44 132" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
      <path d="M27 24 C 12 24 8 46 25 46 C 38 46 37 29 26 28"/>
      <path d="M27 24 L 27 122"/>
      <path d="M18 122 L 36 122"/>
    </svg>
    <div>
      <p class="hero__kicker">World MAP</p>

const ALLOWED_TAGS = {P:1,DIV:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,UL:1,OL:1,LI:1,H1:1,H2:1,H3:1,H4:1,BLOCKQUOTE:1,SPAN:1,A:1,CODE:1,PRE:1,HR:1};

function sanitizeNode(node){
  const out = document.createDocumentFragment();
  node.childNodes.forEach(child => {
    if (child.nodeType === 3){ out.appendChild(document.createTextNode(child.nodeValue)); return; }
    if (child.nodeType !== 1) return;
    const tag = child.tagName;
    if (!ALLOWED_TAGS[tag]){ out.appendChild(sanitizeNode(child)); return; }
    const el = document.createElement(tag.toLowerCase());
    if (tag === 'A'){
      const href = child.getAttribute('href') || '';
      if (/^(https?:|mailto:)/i.test(href)){
        el.setAttribute('href', href);
        el.setAttribute('target', '_blank');
        el.setAttribute('rel', 'noopener noreferrer');
      }
    }
    el.appendChild(sanitizeNode(child));
    out.appendChild(el);
  });
  return out;
}
function sanitizeHTML(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = String(html || '');
  const out = document.createElement('div');
  out.appendChild(sanitizeNode(tmp));
  return out.innerHTML;
}
function noteIsEmpty(html){
  if (!html) return true;
  const d = document.createElement('div');
  d.innerHTML = html;
  return !d.textContent.replace(/[\u200B\u00A0]/g, ' ').trim();
}
function noteToHTML(v){
  if (!v) return '';
  if (/<(p|div|br|ul|ol|li|h[1-6]|b|i|u|strong|em|s|strike|blockquote|span|a|code|pre|hr)\b[^>]*>/i.test(v)) return sanitizeHTML(v);
  return esc(v).replace(/\r\n?|\n/g, '<br>');
}

function saveNote(id, val){
  const clean = val ? sanitizeHTML(val) : '';
  if (clean && !noteIsEmpty(clean)) notes[id] = clean; else delete notes[id];
  try { localStorage.setItem(NKEY, JSON.stringify(notes)); } catch(e){}
}

  const el = document.querySelector('[data-saved="' + id + '"]');
  if (!el) return;
  el.textContent = UI2.saved; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1500);
}

  clearTimeout(noteTimers[id]);

function subsHTML(it, q){
  return '<ol>' + it.subs.map((s, i) => {
    const sid = it.id + 's' + i;
    const hit = q && s.toLowerCase().includes(q);
    return '<li class="sub' + (hit ? ' hit' : '') + '">' +
      '<div class="sub__row">' +
        '<span class="sub__mark"></span>' +

      '<button class="note-clear" data-id="' + sid + '">' + esc(UI2.clear) + '</button></div></div>' +
    '</li>';
  }).join('') + '</ol>';
}
function renderPreview(editor){
  const id = editor.dataset.id;
  const preview = editor.querySelector('.editor__preview');
  if (preview) preview.innerHTML = notes[id] ? sanitizeHTML(notes[id]) : '';
}
function hydrateEditor(editor){
  if (!editor) return;
  editor.dataset.mode = 'view';
  renderPreview(editor);
  const area = editor.querySelector('.editor__area');
  if (area) area.innerHTML = '';
  const host = editor.closest('.sub') || editor.closest('.card');
  if (host) host.classList.toggle('has-note', !noteIsEmpty(notes[editor.dataset.id] || ''));
}
function hydrateSubs(card){
  card.querySelectorAll('.sub').forEach(li => {
    const editor = li.querySelector('.editor');
    if (!editor) return;
    hydrateEditor(editor);
    li.classList.toggle('has-note', !noteIsEmpty(notes[editor.dataset.id] || ''));
  });
}
function hydrateNotes(card){
  const editor = card.querySelector('.card__note .editor');
  if (editor){
    hydrateEditor(editor);
    card.classList.toggle('has-note', !noteIsEmpty(notes[editor.dataset.id] || ''));
  }
  hydrateSubs(card);
}
function clearNote(id, host){

/* ---------- BACKUP / RESTORE ---------- */
async function backupNotes(){
  const payload = { app: 'shepherds-staff', version: 1, exported: new Date().toISOString(), notes: notes, progress: done };
  const json = JSON.stringify(payload, null, 2);
  if (window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: 'shepherds-staff-notes.json',
        types: [{ description: 'JSON file', accept: { 'application/json': ['.json'] } }]
      });
      const w = await handle.createWritable();
      await w.write(json);
      await w.close();
      showToast('Backup saved.');
      return;
    }catch(err){
      if (err && err.name === 'AbortError') return;
    }
  }
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'shepherds-staff-notes.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded.');
}
function processRestoreFile(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (d.notes) notes = Object.assign(notes, d.notes);
      if (d.progress) done = Object.assign(done, d.progress);
      try {
        localStorage.setItem(NKEY, JSON.stringify(notes));
        localStorage.setItem(PKEY, JSON.stringify(done));
      } catch(e){}
      applyNotes(); refresh();
      showToast('Notes restored successfully.');
    }catch(err){ showToast('Could not read that file.'); }
  };
  r.readAsText(file);
}
async function restoreNotes(){
  if (window.showOpenFilePicker){
    try{
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'JSON file', accept: { 'application/json': ['.json'] } }],
        multiple: false
      });
      const file = await handle.getFile();
      processRestoreFile(file);
      return;
    }catch(err){
      if (err && err.name === 'AbortError') return;
    }
  }
  document.getElementById('restoreFile').click();
}
document.getElementById('backupBtn').addEventListener('click', backupNotes);
document.getElementById('restoreBtn').addEventListener('click', restoreNotes);
document.getElementById('restoreFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) processRestoreFile(f);
  e.target.value = '';
});

/* ---- progress ---- */
function toggleDone(id, card){
  if (done[id]) { delete done[id]; card.classList.remove('done'); }
  else { done[id] = 1; card.classList.add('done'); }
  try { localStorage.setItem(PKEY, JSON.stringify(done)); } catch(e){}
  refresh();
}
function refresh(){
  let n = 0;
  DATA.forEach(part => {
    let c = 0;
    part.items.forEach(it => {
      const card = document.getElementById('card-' + it.id);
      if (!card) return;
      if (done[it.id]) { c++; card.classList.add('done'); } else { card.classList.remove('done'); }
    });
    n += c;
    const pct = part.items.length ? (c / part.items.length * 100) : 0;
    const fill = document.querySelector('[data-fill="' + part.id + '"]');
    const cnt = document.querySelector('[data-count="' + part.id + '"]');
    if (fill) fill.style.width = pct + '%';
    if (cnt) cnt.textContent = c;
  });
  const pct = TOTAL ? Math.round(n / TOTAL * 100) : 0;
  const ring = document.getElementById('ringFg');
  if (ring) ring.style.strokeDashoffset = 100 - pct;
  document.getElementById('meterNum').textContent = n + ' / ' + TOTAL;
}

/* ---- search ---- */
const qEl = $('#q');
const noMatch = $('#nomatch');
function hl(text, q){
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}
function filter(){
  const q = qEl.value.trim().toLowerCase();
  let visible = 0;
  DATA.forEach(part => {
    let pv = 0;
    part.items.forEach(it => {
      const card = document.getElementById('card-' + it.id);
      if (!card) return;
      const subsBox = card.querySelector('.card__subs');
      const titleMatch = !q || it.title.toLowerCase().includes(q);
      const hits = q ? it.subs.filter(s => s.toLowerCase().includes(q)) : [];
      const show = !q || titleMatch || hits.length > 0;
      card.classList.toggle('hide', !show);
      if (show) pv++;
      if (subsBox){
        subsBox.innerHTML = subsHTML(it, q);
        hydrateSubs(card);
        if (q && hits.length && !titleMatch) card.classList.add('open');
      }
      const t = card.querySelector('.card__title');
      if (t) t.innerHTML = q && titleMatch ? hl(it.title, q) : esc(it.title);
    });
    document.getElementById(part.id).classList.toggle('hide', q && pv === 0);
    if (q && pv > 0) document.getElementById(part.id).classList.remove('collapsed');
    visible += pv;
  });
  noMatch.classList.toggle('show', !!q && visible === 0);
}
qEl.addEventListener('input', filter);

/* ---- editor mode switching ---- */
function setMode(editor, mode){
  if (!editor) return;
  const id = editor.dataset.id;
  if (mode === 'edit'){
    closeEmoji();
    const area = editor.querySelector('.editor__area');
    if (!area) return;
    area.innerHTML = noteToHTML(notes[id] || '');
    editor.dataset.mode = 'edit';
    setTimeout(() => {
      area.focus();
      placeCaretEnd(area);
      updateToolbar(editor);
    }, 0);
  } else {
    closeEmoji();
    const area = editor.querySelector('.editor__area');
    if (area){
      if (area.innerHTML === '<br>' || area.innerHTML === '<div><br></div>') area.innerHTML = '';
      const clean = sanitizeHTML(area.innerHTML);
      if (clean && !noteIsEmpty(clean)) notes[id] = clean; else delete notes[id];
      try { localStorage.setItem(NKEY, JSON.stringify(notes)); } catch(e){}
      area.innerHTML = '';
    }
    renderPreview(editor);
    editor.dataset.mode = 'view';
    const host = editor.closest('.sub') || editor.closest('.card');
    if (host) host.classList.toggle('has-note', !noteIsEmpty(notes[id] || ''));
    if (notes[id]) flashSaved(id);
  }
}

/* ---- editor behaviour ---- */
let lastArea = null, emojiPanel = null, emojiTarget = null;

function placeCaretEnd(el){
  try{
    const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
    const s = document.getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
function updateToolbar(editor){
  if (!editor) return;
  editor.querySelectorAll('.editor__btn[data-cmd]').forEach(btn => {
    const cmd = btn.dataset.cmd;
    if (cmd === 'formatBlock') return;
    let on = false;
    try { on = document.queryCommandState(cmd); } catch(e){}
    btn.classList.toggle('on', !!on);
  });
}
function editorChanged(area){
  const id = area.dataset.id;
  if (area.innerHTML === '<br>' || area.innerHTML === '<div><br></div>') area.innerHTML = '';
  const host = area.closest('.sub') || area.closest('.card');
  const has = !noteIsEmpty(area.innerHTML);
  if (host) host.classList.toggle('has-note', has);
  saveNote(id, has ? area.innerHTML : '');
  flashSavedThrottled(id);
}
function closeEmoji(){
  if (emojiPanel){ emojiPanel.remove(); emojiPanel = null; emojiTarget = null; }
}
function toggleEmoji(btn, area){
  if (emojiPanel){ closeEmoji(); return; }
  emojiTarget = area;
  emojiPanel = document.createElement('div');
  emojiPanel.className = 'emoji-panel';
  emojiPanel.innerHTML = EMOJIS.map(e => '<button type="button">' + e + '</button>').join('');
  document.body.appendChild(emojiPanel);
  const w = 244;
  emojiPanel.style.width = w + 'px';
  const r = btn.getBoundingClientRect();
  let left = Math.max(8, Math.min(r.left, window.innerWidth - w - 12));
  let top = r.bottom + 6;
  const h = emojiPanel.offsetHeight;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  emojiPanel.style.left = left + 'px';
  emojiPanel.style.top = top + 'px';
}

document.addEventListener('mousedown', e => {
  if (e.target.closest && e.target.closest('.editor__bar, .emoji-panel')) e.preventDefault();
});
document.addEventListener('click', e => {
  const btn = e.target.closest && e.target.closest('.editor__btn');
  if (btn){
    const editor = btn.closest('.editor');
    const area = editor && editor.querySelector('.editor__area');
    if (!area || editor.dataset.mode !== 'edit') return;
    area.focus();
    if (btn.dataset.emoji){ toggleEmoji(btn, area); return; }
    let cmd = btn.dataset.cmd, val = btn.dataset.val || null;
    if (cmd === 'formatBlock'){
      let cur = '';
      try { cur = (document.queryCommandValue('formatBlock') || '').toLowerCase(); } catch(err){}
      if (cur === val) val = 'p';
    }
    try { document.execCommand(cmd, false, val); } catch(err){}
    if (cmd === 'removeFormat'){ try { document.execCommand('formatBlock', false, 'p'); } catch(err){} }
    updateToolbar(editor);
    editorChanged(area);
    return;
  }
  const em = e.target.closest && e.target.closest('.emoji-panel button');
  if (em){
    const area = emojiTarget;
    if (area){
      area.focus();
      try { document.execCommand('insertText', false, em.textContent); } catch(err){}
      editorChanged(area);
    }
    closeEmoji();
    return;
  }
  if (!(e.target.closest && e.target.closest('.emoji-panel'))) closeEmoji();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeEmoji(); }
});
document.addEventListener('selectionchange', () => {
  const sel = document.getSelection();
  if (!sel || !sel.anchorNode) return;
  const node = sel.anchorNode;
  const el = node.nodeType === 1 ? node : node.parentElement;
  const area = el && el.closest ? el.closest('.editor__area') : null;
  if (area === lastArea) return;
  if (lastArea){ const ed = lastArea.closest('.editor'); if (ed) ed.classList.remove('focused'); }
  lastArea = area;
  if (area){ const ed = area.closest('.editor'); if (ed) ed.classList.add('focused'); updateToolbar(ed); }
});
window.addEventListener('resize', closeEmoji);
window.addEventListener('scroll', closeEmoji, true);

/* ---- note events ---- */
main.addEventListener('paste', e => {
  const area = e.target.closest && e.target.closest('.editor__area');
  if (!area) return;
  e.preventDefault();
  const cd = e.clipboardData;
  const html = cd.getData('text/html');
  const text = cd.getData('text/plain');
  let insert = html ? sanitizeHTML(html) : esc(text).replace(/\r\n?|\n/g, '<br>');
  insert = insert.replace(/<br\s*\/?>\s*$/i, '');
  if (insert){ try { document.execCommand('insertHTML', false, insert); } catch(err){} }
  editorChanged(area);
});
main.addEventListener('click', e => {
  const nb = e.target.closest('.note-btn, .sub-note-btn');
  if (nb){
    const host = nb.closest('.sub') || nb.closest('.card');
    if (!host) return;
    host.classList.toggle('note-open');
    const editor = host.querySelector('.editor');
    if (host.classList.contains('note-open') && editor){
      hydrateEditor(editor);
    }
    e.stopPropagation();
    return;
  }
  const editBtn = e.target.closest('.editor__edit-btn');
  if (editBtn){
    setMode(editBtn.closest('.editor'), 'edit');
    e.stopPropagation();
    return;
  }
  const doneBtn = e.target.closest('.editor__done');
  if (doneBtn){
    setMode(doneBtn.closest('.editor'), 'view');
    e.stopPropagation();
    return;
  }
  const clr = e.target.closest('.note-clear');
  if (clr){
    const host = clr.closest('.sub') || clr.closest('.card');
    const editor = host && host.querySelector('.editor');
    if (editor){
      if (editor.dataset.mode === 'edit'){
        const area = editor.querySelector('.editor__area');
        if (area) area.innerHTML = '';
      }
      renderPreview(editor);
    }
    clearNote(clr.dataset.id, host);
    e.stopPropagation();
  }
});
main.addEventListener('input', e => {
  const area = e.target.closest && e.target.closest('.editor__area');
  if (!area) return;
  editorChanged(area);
});
main.addEventListener('blur', e => {
  const area = e.target && e.target.closest ? e.target.closest('.editor__area') : null;
  if (!area) return;
  if (!area.textContent.trim()) area.innerHTML = '';
  saveNote(area.dataset.id, area.innerHTML);
}, true);
main.addEventListener('focusout', e => {
  const editor = e.target.closest && e.target.closest('.editor');
  if (!editor) return;
  setTimeout(() => {
    if (editor.dataset.mode === 'edit' && !editor.contains(document.activeElement)){
      setMode(editor, 'view');
    }
  }, 0);
});

/* ---- reset ---- */
$('#resetBtn').addEventListener('click', () => {
  if (!Object.keys(done).length) return;
  if (!confirm(UI.reset + '?')) return;
  done = {};
  try { localStorage.removeItem(PKEY); } catch(e){}
  refresh();
});
$('#expandBtn').addEventListener('click', () => {
  document.querySelectorAll('.part').forEach(p => p.classList.remove('collapsed'));
  document.querySelectorAll('.card').forEach(c => { if (c.querySelector('.card__subs')) c.classList.add('open'); });
});
$('#collapseBtn').addEventListener('click', () => {
  document.querySelectorAll('.part').forEach(p => p.classList.add('collapsed'));
  document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
});

/* ---- theme ---- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(TKEY, t); } catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]:not([media])');
  const light = document.querySelector('meta[name="theme-color"][media*="light"]');
  const dark = document.querySelector('meta[name="theme-color"][media*="dark"]');
  if (light) light.removeAttribute('media');
  if (dark) dark.removeAttribute('media');
  // Simplify: keep media-specific versions; nothing else to do
}
const savedT = (()=>{ try { return localStorage.getItem(TKEY); } catch(e){ return null; } })();
applyTheme(savedT || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
const sun = document.querySelector('.ic-sun'), moon = document.querySelector('.ic-moon');
function syncThemeIcons(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  sun.style.display = dark ? 'none' : 'block';
  moon.style.display = dark ? 'block' : 'none';
}
syncThemeIcons();
$('#themeBtn').addEventListener('click', syncThemeIcons);

/* ---- scroll spy ---- */
const links = [...sidebar.querySelectorAll('.side-link')];
const obs = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting){
    links.forEach(l => l.classList.toggle('active', l.dataset.part === e.target.id));
  }});
}, {rootMargin:'-15% 0px -70% 0px'});
DATA.forEach(p => obs.observe(document.getElementById(p.id)));

refresh();

/* ================================================================
   PWA SETUP — manifest, icon, install prompt
   ================================================================ */
const APP_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0" stop-color="#2d4a75"/>
<stop offset="1" stop-color="#14213a"/>
</linearGradient>
<linearGradient id="gld" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f3d995"/>
<stop offset="1" stop-color="#a9781f"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.3" r="0.8">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<rect width="512" height="512" rx="112" fill="url(#glow)"/>
<circle cx="256" cy="256" r="196" fill="none" stroke="url(#gld)" stroke-width="3" opacity="0.28"/>
<circle cx="256" cy="256" r="168" fill="none" stroke="url(#gld)" stroke-width="1.5" opacity="0.18"/>
<g fill="none" stroke="url(#gld)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
<path d="M325 178 C 190 178 155 320 295 320 C 400 320 385 195 305 190"/>
<path d="M325 178 L 325 410"/>
<path d="M268 410 L 382 410"/>
</g>
</svg>`;

function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = (e) => reject(e);
    img.src = src;
  });
}
function svgToPNG(img, size){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  ctx.drawImage(img, 0, 0, size, size);
  return c.toDataURL('image/png');
}

(async function setupPWA(){
  let icon192, icon512, icon180, icon32;
  const svgDataURI = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(APP_ICON_SVG);
  try {
    const img = await loadImage(svgDataURI);
    icon192 = svgToPNG(img, 192);
    icon512 = svgToPNG(img, 512);
    icon180 = svgToPNG(img, 180);
    icon32  = svgToPNG(img, 32);
  } catch(e){
    console.warn('Icon rasterization failed; falling back to SVG.', e);
    icon192 = icon512 = icon180 = icon32 = svgDataURI;
  }

  // Favicon
  let fav = document.querySelector('link[rel="icon"]');
  if (!fav){ fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
  fav.type = icon32.startsWith('data:image/png') ? 'image/png' : 'image/svg+xml';
  fav.href = icon32;

  // Apple touch icon
  let ati = document.querySelector('link[rel="apple-touch-icon"]');
  if (!ati){ ati = document.createElement('link'); ati.rel = 'apple-touch-icon'; document.head.appendChild(ati); }
  ati.href = icon180;

  // Web app manifest
  let startUrl, scope;
  try {
    const u = new URL(location.href);
    startUrl = u.href.split('#')[0];
    scope = u.origin + u.pathname.replace(/[^/]*$/, '');
  } catch(e){
    startUrl = location.href;
    scope = './';
  }
  const manifest = {
    id: startUrl,
    name: "The Shepherd's Staff — Study Companion",
    short_name: "Shepherd's Staff",
    description: "A study companion for The Shepherd's Staff with notes, progress tracking, and topic concordance.",
    start_url: startUrl,
    scope: scope,
    display: 'standalone',
    display_override: ['standalone', 'minimal-ui', 'browser'],
    orientation: 'any',
    background_color: '#f6f2ea',
    theme_color: '#1f3a5f',
    lang: 'te',
    dir: 'ltr',
    categories: ['education', 'books', 'productivity'],
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
  try {
    const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const mUrl = URL.createObjectURL(mBlob);
    let link = document.querySelector('link[rel="manifest"]');
    if (!link){ link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = mUrl;
  } catch(e){ console.warn('Manifest setup failed.', e); }
})();

/* ---- Install prompt ---- */
const installBtn = document.getElementById('installBtn');
let deferredPrompt = null;

function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || (window.navigator && window.navigator.standalone === true);
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isAndroid = /Android/i.test(navigator.userAgent);

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (installBtn && !isStandalone()) installBtn.hidden = false;
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  if (installBtn) installBtn.hidden = true;
  showToast('App installed. Look for it on your home screen.');
});

if (installBtn){
  // Show install button on iOS Safari (uses manual A2HS), and if installable already
  if (!isStandalone() && (isIOS || isAndroid)) installBtn.hidden = false;

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt){
      try {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        if (choice && choice.outcome === 'accepted'){
          showToast('Installing app…');
        }
      } catch(e){}
      deferredPrompt = null;
      installBtn.hidden = true;
      return;
    }
    if (isIOS){
      showToast('Tap Share  →  “Add to Home Screen” to install.', 5200);
      return;
    }
    if (isAndroid){
      showToast('Open the browser menu (⋮) and tap “Install app” or “Add to Home screen”.', 5200);
      return;
    }
    showToast('Use your browser menu to add this page to your home screen.', 4800);
  });
}
